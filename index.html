<div class="card" style="display:flex;flex-direction:column"${R}><h3>Payment Settlement ${chip('Settled')}</h3><div style="display:flex;height:16px;border-radius:99px;overflow:hidden;margin:6px 0 14px"><i style="width:64%;background:var(--violet)"></i><i style="width:24%;background:var(--tx)"></i><i style="width:12%;background:var(--amber)"></i></div>${[['UPI / QR Direct','₹4,14,800','64%','var(--violet)'],['Card POS Machine','₹1,55,500','24%','var(--tx)'],['Cash in Drawer','₹77,900','12%','var(--amber)']].map(r=>`<div class="leg"><i style="background:${r[3]}"></i>${r[0]}<b>${r[1]}</b><span>${r[2]}</span></div>`).join('')}<div class="sp"></div><div style="background:var(--soft);border-radius:20px;padding:14px;font-size:13px"><small class="mut" style="font-weight:600;display:block">Zero Merchant MDR</small>UPI settlements routed instantly to HDFC Current Account.</div></div></div>`}

// ---------- NAVIGATION & ENGINE ----------
const PG={dashboard:dash,new:newc,walkin:newc,appointment:apptc,customers:cust,barbers:barb,campaigns:camp,reports:rep};
function side(){$('#side').innerHTML=`<div class="logo"><div class="mk">J</div><span>Jawed Salon</span></div><div class="lbl">SALON OS</div><div id="nav"><div class="ind" style="transform:translateY(${IL}px)"></div>${NAV.map(([k,l])=>`<button class="nb ${P===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICO[k]}</svg>${l}</button>`).join('')}</div><div class="sp"></div><div class="tip"><small>Salon Insight</small>Balayage & Hair Spa treatments drive 60% of weekend salon profits.</div><div class="me"><i class="av" style="width:36px;height:36px;background:var(--amber);color:#14161B">J</i><div><b>Jawed Salon</b><small>MG Road · Pune</small></div></div><button class="rst" onclick="resetDatabase()">Reset Demo Database</button>`}
function ind(){const n=document.querySelector('#nav .on'),i=document.querySelector('.ind');if(n&&i){i.style.transform=`translateY(${n.offsetTop}px)`;i.style.height=n.offsetHeight+'px';IL=n.offsetTop}}
function count(){document.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,f=e.dataset.f==='inr'?inr:x=>String(Math.round(x)),t0=performance.now(),d=1100;const step=t=>{const p=Math.min((t-t0)/d,1),v=to*(1-Math.pow(1-p,4));e.textContent=f(v);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function render(){side();const m=$('#main');m.innerHTML=`<div class="view">${PG[P]()}</div>`;m.querySelectorAll('[data-rise]').forEach((e,i)=>e.style.setProperty('--i',i));count();requestAnimationFrame(ind)}
function go(k){if(k===P)return;P=k;history.replaceState(null,'','#'+k);render();window.scrollTo({top:0,behavior:'smooth'})}
function upd(){$('#tt').textContent=inr([...sel].reduce((a,s)=>a+(SV[s]||650),0))}
function updAppt(){const el=$('#att');if(el)el.textContent=inr([...asSel].reduce((a,s)=>a+(SV[s]||650),0))}

function settleScheduled(id){
  const item=(st.upcoming||[]).find(x=>x.id===id);
  if(!item)return;
  st.upcoming=st.upcoming.filter(x=>x.id!==id);
  save();
  prefillBill=item;
  go('new');
  toast(`⚡ Walk-in Checkout loaded for ${item.n}`);
}

async function resetDatabase() {
  try {
    await fetch('/api/reset', { method: 'POST' });
  } catch(e) {}
  st = seed();
  save();
  render();
  toast('Jawed Salon database reset to clean state ✓');
}

// Click listener
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.s){sel.has(b.dataset.s)?sel.delete(b.dataset.s):sel.add(b.dataset.s);b.classList.toggle('on');upd()}
if(b.dataset.as){asSel.has(b.dataset.as)?asSel.delete(b.dataset.as):asSel.add(b.dataset.as);b.classList.toggle('on');updAppt()}
if(b.dataset.b||b.dataset.m||b.dataset.ab||b.dataset.t){const g=b.parentElement;g.querySelectorAll('.sv').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.m)payM=b.dataset.m}

// Walk-in Settle Click
if(b.id==='sv2'){
  const n=$('#fn').value.trim() || 'Walk-in Guest';
  const p=$('#fp').value.replace(/\D/g,'') || '9800000000';
  if(!sel.size) return toast('Please select at least 1 completed service');
  const bar=document.querySelector('#cb .on')?.dataset.b || BA[0];
  const ph=p.length===10?p.slice(0,5)+' '+p.slice(5):p;
  const totalBill=[...sel].reduce((a,s)=>a+(SV[s]||650),0);
  
  // 1. Save to state & local database with status 'Completed'
  st.today.push({n,p:ph,sv:[...sel],b:bar,m:payM,r:5,status:'Completed',id:'apt-'+Date.now().toString().slice(-6)});
  const a=st.today[st.today.length-1],x=st.crm.find(c=>c.p===ph);
  if(x){x.v++;x.s+=amt(a);x.d=0;x.b=bar}else{st.crm.unshift({n,p:ph,d:0,v:1,s:amt(a),b:bar,r:5,t:'New',u:a.sv.join(' + ')});st.added++}
  save();

  // 2. Persist to SQLite backend
  fetch('/api/appointments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      clientName: n,
      clientPhone: p,
      serviceName: [...sel].join(' + '),
      stylist: bar,
      price: totalBill,
      paymentMode: payM,
      status: 'Completed'
    })
  }).catch(()=>{});

  // Reset form selection
  sel=new Set();payM='UPI';
  toast(`✓ Bill Settled: ${inr(totalBill)} collected via ${payM}`);
  P='dashboard';history.replaceState(null,'','#dashboard');render();
}

// Advance Appointment Booking Click
if(b.id==='btnBookAppt'){
  const n=$('#an').value.trim();
  const p=$('#ap').value.replace(/\D/g,'');
  if(!n) return toast('Please enter client full name');
  if(!p || p.length < 10) return toast('Please enter a valid 10-digit mobile number');
  if(!asSel.size) return toast('Please select at least 1 salon service');

  const bar=document.querySelector('#ab .on')?.dataset.ab || BA[0];
  const tme=document.querySelector('#at .on')?.dataset.t || '03:30 PM';
  const dte=$('#ad').value || 'Today';
  const notes=$('#anotes').value.trim();
  const ph=p.length===10?p.slice(0,5)+' '+p.slice(5):p;
  const price=[...asSel].reduce((a,s)=>a+(SV[s]||650),0);
  const sendWa=$('#sendWaCheck')?.checked;

  const appt={id:'sch-'+Date.now().toString().slice(-6),n,p:ph,sv:[...asSel],b:bar,time:tme,date:dte,price,notes};
  if(!st.upcoming) st.upcoming=[];
  st.upcoming.push(appt);
  save();

  fetch('/api/appointments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      clientName: n,
      clientPhone: p,
      serviceName: [...asSel].join(' + '),
      stylist: bar,
      time: tme,
      date: dte,
      price: price,
      status: 'Scheduled',
      notes: notes
    })
  }).catch(()=>{});

  toast(`✓ Appointment scheduled for ${n} at ${tme}`);

  if(sendWa){
    const msg=`Hi ${n}! ✨ Your appointment at *Jawed Salon* is scheduled for *${dte} at ${tme}* with *${bar}* (${appt.sv.join(', ')}). We look forward to seeing you! 💇‍♂️💆‍♀️`;
    const url=`https://wa.me/91${p}?text=${encodeURIComponent(msg)}`;
    window.open(url,'_blank');
  }

  asSel=new Set(['Haircut & Beard']);
  P='dashboard';history.replaceState(null,'','#dashboard');render();
}});

addEventListener('input',e=>{if(e.target.id==='fp')e.target.value=e.target.value.replace(/\D/g,'')});
addEventListener('resize',ind);addEventListener('load',ind);
render();
</script></body></html>
